services:
  postgres:
    image: postgres:16
    container_name: sokone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sokone
      POSTGRES_PASSWORD: sokone_dev
      POSTGRES_DB: sokone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
